# ./nginx/nginx.conf
# This configuration is for the 'external_nginx_proxy' service defined in docker-compose.yml.
# It handles SSL termination and proxies requests to your applications.

# --- Book Catalog App (dot.arifjan.su) ---
server {
    listen 80; # Listen on HTTP port 80
    server_name dot.arifjan.su; # Your domain for the Book Catalog app
    
    # Redirect all HTTP traffic to HTTPS for this domain
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2; # Listen on HTTPS port 443, enable HTTP/2
    server_name dot.arifjan.su; # Your domain for the Book Catalog app
    
    # SSL Certificate and Key paths (ensure these files exist in ./certs on your host)
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    
    # SSL Best Practices & Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m; # 10MB cache for SSL sessions
    ssl_session_tickets off;          # Disable session tickets for better Perfect Forward Secrecy
    # Optional: If you have a dhparams.pem file for DHE ciphers:
    # ssl_dhparam /etc/nginx/certs/dhparams.pem; 
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # HSTS
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Consider a Content-Security-Policy header, adjust as needed for your app:
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" always;

    location / { # Proxy requests to your Book Catalog Flask app
        proxy_pass http://app:5000; # 'app' is the service name of your Flask app container, listening on port 5000
        
        # Standard proxy headers
        proxy_set_header Host $host; # Or $http_host if $host causes issues
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # $scheme will be 'https' here
    }
}

# --- GitLab (gitlab.dot.arifjan.su) ---
server {
    listen 80; # Listen on HTTP port 80
    server_name gitlab.dot.arifjan.su; # Your GitLab subdomain
    
    # Redirect all HTTP traffic to HTTPS for this domain
    location / {
        return 301 https://$host$request_uri; # $host will be gitlab.dot.arifjan.su
    }
}

server {
    listen 443 ssl http2; # Listen on HTTPS port 443, enable HTTP/2
    server_name gitlab.dot.arifjan.su; # Your GitLab subdomain
    
    # SSL Certificate and Key paths
    # Ensure these files exist in ./certs on your host and cover gitlab.dot.arifjan.su
    # (e.g., a wildcard *.dot.arifjan.su or a SAN certificate).
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    
    # SSL Best Practices & Security (can be similar to the app server block)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    # ssl_dhparam /etc/nginx/certs/dhparams.pem;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # HSTS
    # Add other security headers as needed

    # GitLab specific: Increase client_max_body_size for large file uploads, LFS, etc.
    # Set to 0 for unlimited (use with caution) or a specific size like 250m, 1g.
    client_max_body_size 500m; # Example: 500MB

    location / {
        proxy_pass http://gitlab:80; # Proxy to the GitLab container's internal HTTP port (gitlab service, port 80)
        
        # Headers to pass to the GitLab backend
        proxy_set_header Host $http_host; # Ensures GitLab sees the correct public host (gitlab.dot.arifjan.su)
        proxy_set_header X-Real-IP $remote_addr; # The actual client IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # List of proxies, client IP first
        proxy_set_header X-Forwarded-Proto $scheme; # Will be 'https' as this block handles HTTPS
        proxy_set_header X-Forwarded-Ssl "on";   # Explicitly tell GitLab SSL was used by the proxy

        # Settings for GitLab (especially for long polling, WebSockets used by CI logs, web terminal)
        proxy_read_timeout 300s;        # Timeout for reading a response from the proxied server
        proxy_connect_timeout 300s;     # Timeout for establishing a connection with the proxied server
        proxy_redirect off;             # Do not let GitLab try to send its own redirects that might be incorrect
        
        # Required for WebSockets (e.g., for CI live logs, web terminal)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade; # Allows upgrading the connection to WebSocket
        proxy_set_header Connection "upgrade";  # Standard header for WebSocket connections

        # GitLab specific: To prevent issues with LFS, artifacts, package uploads, etc.,
        # it's often recommended to turn off proxy_request_buffering.
        proxy_request_buffering off; 
    }
}
