# docker-compose.yml
# SSL termination is handled by 'external_nginx_proxy'.
# 'gitlab_net' is defined with a static subnet to reliably trust the proxy.

services:
  postgres: # For Book Catalog App
    image: postgres:13
    container_name: book_catalog_postgres
    restart: always
    environment:
      POSTGRES_USER: "bookuser"
      POSTGRES_PASSWORD: "bookpassword" # Consider Docker secrets for production
      POSTGRES_DB: "book_catalog"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - app_net

  app: # Book Catalog App (Flask)
    build: 
      context: . 
      dockerfile: app/Dockerfile
    container_name: book_catalog_app
    restart: always
    depends_on:
      - postgres
    environment:
      FLASK_CONFIG: "development" 
      SECRET_KEY: "your_flask_app_secret_key_CHANGE_ME" # CHANGE THIS
    volumes:
      - ./app:/app/app 
      - ./.env:/app/.env 
    networks:
      - app_net

  nginx: # External Nginx Proxy (was book_catalog_nginx, renamed for clarity if desired)
    image: nginx:latest
    container_name: external_nginx_proxy 
    restart: always
    depends_on:
      - app      
      - gitlab   
    ports:
      - "80:80"   
      - "443:443" 
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro 
      - ./certs:/etc/nginx/certs:ro 
    networks:
      app_net:    
      gitlab_net: 

  gitlab:
    image: 'gitlab/gitlab-ce:latest' 
    container_name: gitlab
    restart: always
    hostname: 'gitlab.dot.arifjan.su' 
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.dot.arifjan.su'
        gitlab_rails['external_url'] = 'https://gitlab.dot.arifjan.su' 
        gitlab_rails['gitlab_shell_ssh_port'] = 2223

        nginx['enable'] = true
        nginx['listen_addresses'] = ['0.0.0.0', '[::]'] 
        nginx['listen_port'] = 80  
        nginx['listen_https'] = false 
        nginx['redirect_http_to_https'] = false 

        # Trust requests from any IP within the 'gitlab_net' subnet (172.19.0.0/16).
        gitlab_rails['trusted_proxies'] = [ '172.19.0.0/16' ] # CRITICAL
        nginx['real_ip_trusted_addresses'] = [ '172.19.0.0/16' ] 
        nginx['real_ip_header'] = 'X-Forwarded-For' 
        nginx['real_ip_recursive'] = 'on'

        # Let GitLab's default internal Nginx proxy_set_headers logic work.
        # It should respect X-Forwarded-Proto and Host from the trusted external proxy.
        # No explicit nginx['proxy_set_headers'] block here.

        postgresql['enable'] = true

        gitlab_rails['gitlab_kas_enabled'] = true 
        gitlab_rails['gitlab_kas_external_url'] = 'wss://gitlab.dot.arifjan.su/-/kubernetes-agent/'
        gitlab_rails['gitlab_kas_internal_url'] = 'grpc://localhost:8153' 
        gitlab_rails['gitlab_kas_external_k8s_proxy_url'] = 'https://gitlab.dot.arifjan.su/-/kubernetes-agent/k8s-proxy/'
        
    ports:
      - '2223:22'
    volumes:
      - './gitlab/config:/etc/gitlab'      
      - './gitlab/logs:/var/log/gitlab'      
      - './gitlab/data:/var/opt/gitlab'      
    shm_size: '256m' 
    networks:
      gitlab_net: 

networks:
  app_net: 
    driver: bridge
  gitlab_net: 
    driver: bridge
    ipam: 
      driver: default
      config:
        - subnet: "172.19.0.0/16" # Static subnet for gitlab_net
          # gateway: "172.19.0.1"  # Optional: define a gateway
